--ozone-platform=wayland
--password-store=gnome-libsecret
--enable-features=TouchpadOverscrollHistoryNavigation,OverlayScrollbar
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim
--no-default-browser-check

# UTM's current VirGL backend cannot create Chromium's required GL context.
# Software rendering works on native Wayland and follows the output scale.
--disable-gpu

# CPU video decoding/compositing avoids unsupported VM acceleration paths.
--disable-accelerated-video-decode
--disable-gpu-compositing
